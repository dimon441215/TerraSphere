        .glow {

<polygon points="170,205 370,150 570,205" fill="#C9985F"/><polygon points="170,205 370,150 570,205 570,214 170,214" fill="#8F6535"/>
<line x1="372" y1="225" x2="372" y2="262" stroke="#F4D9A4" stroke-width="2"/><circle cx="372" cy="270" r="9" fill="#FFE2AE"/>
<rect x="225" y="318" width="70" height="26" rx="4" fill="#1F2D28"/><rect x="450" y="312" width="64" height="32" rx="4" fill="#1F2D28"/><rect x="335" y="332" width="60" height="12" fill="#1F2D28"/>
</svg>`;

      const cta = (t) =>
        `<section class="cta"><div class="w"><h2>${t || "Узнайте стоимость вашей террасы за минуту"}</h2><p>Ответьте на 4 вопроса, и мы покажем ориентировочную цену. Точный расчёт сделаем после бесплатного замера.</p><a class="btn" href="#raschet">Рассчитать стоимость</a> <a class="btn o" href="tel:${tel}">Позвонить</a></div></section>`;

      const form = (
        title,
      ) => `<form class="q" id="lead" style="max-width:520px"><h3>${title || "Оставить заявку"}</h3>
<label class="f">Имя<input name="n" required autocomplete="name"></label>
<label class="f">Телефон<input name="p" type="tel" required autocomplete="tel" placeholder="+7"></label>
<label class="f">Город<select name="c"><option>Воронеж</option><option>Липецк</option><option>Другой город</option></select></label>
<button class="btn" type="submit">Отправить заявку</button><p class="note" style="margin-top:.8rem">Перезвоним в течение 15 минут в рабочее время.</p></form>`;

      const kitCard = (key, x) =>
        `<div class="card kit${x[3] ? " top" : ""}">${x[3] ? '<span class="tag">Выбирают чаще</span>' : ""}<h3>${x[0]}</h3><div class="pr">${x[1]}</div><ul>${x[2].map((i) => `<li>${i}</li>`).join("")}</ul><a class="btn" href="#raschet" data-pre="${key}" style="margin-top:auto;text-align:center">Заказать комплект</a></div>`;

      const prodCards = () =>
        K.map(
          (k) =>
            `<a class="card" href="#${k}"><h3>${P[k].n}</h3><p>${P[k].s}</p><span class="pr">от ${P[k].k[0][1].replace("от ", "")}</span></a>`,
        ).join("");

      const pages = {
        home: () => `<div class="hero"><div class="w"><div><h1>Террасы, навесы и мангальные зоны для жизни на воздухе</h1><p>TerraSphere строит закрытые террасы, навесы, беседки и мангальные зоны, а также остекляет входные группы. Работаем в Воронеже и Липецке.</p><div class="acts"><a class="btn" href="#raschet">Рассчитать стоимость</a><a class="btn o" href="tel:${tel}">Позвонить</a></div></div>${hero()}</div></div>
<section><div class="w"><h2>Что мы строим</h2><div class="grid">${prodCards()}</div></div></section>
<section class="sf"><div class="w"><h2>Как мы работаем</h2><ol class="steps"><li><b>Заявка</b><span>Звонок или квиз на сайте. Обсуждаем задачу и бюджет.</span></li><li><b>Замер и проект</b><span>Приезжаем на участок бесплатно, предлагаем решение.</span></li><li><b>Договор и смета</b><span>Фиксируем цену и сроки. Без доплат по ходу работ.</span></li><li><b>Строительство</b><span>Собственная бригада, аккуратный монтаж, уборка.</span></li><li><b>Сдача и гарантия</b><span>Принимаете работу вместе с нами. Выдаём гарантийный талон.</span></li></ol></div></section>
<section><div class="w two"><div><h2>Готовые комплекты по понятной цене</h2><p>Для каждого направления собрали три комплекта с фиксированным составом работ. Выберите подходящий и оставьте заявку, а мы уточним детали на замере.</p><a class="btn" href="#komplekty">Смотреть комплекты</a></div>${form()}</div></section>${cta()}`,
        komplekty: () =>
          `<section><div class="w"><h1>Комплекты и цены</h1><p>Цены указаны для базового состава работ. Итоговая стоимость зависит от участка, материалов и пожеланий. Точную смету составим после замера.</p></div></section>` +
          K.map(
            (k, i) =>
              `<section class="${i % 2 ? "" : "sf"}" style="padding-block:3rem"><div class="w"><h2><a href="#${k}" style="text-decoration:none">${P[k].n}</a></h2><div class="grid">${P[k].k.map((x) => kitCard(k, x)).join("")}</div></div></section>`,
          ).join("") +
          cta(),
        raschet: () =>
          `<section><div class="w"><h1>Расчёт стоимости</h1><div id="quiz"></div></div></section>`,
        kontakty: () =>
          `<section><div class="w two"><div><h1>Контакты</h1><p>Звоните или пишите в мессенджер. Отвечаем быстро.</p><ul class="feat"><li><b>Телефон</b><br><a href="tel:${tel}">${CFG.phone}</a></li><li><b>Telegram</b><br><a href="https://t.me/${CFG.tg}">@${CFG.tg}</a></li><li><b>WhatsApp</b><br><a href="https://wa.me/${CFG.wa}">Написать в WhatsApp</a></li><li><b>E-mail</b><br><a href="mailto:${CFG.email}">${CFG.email}</a></li><li><b>Время работы</b><br>${CFG.hours}</li></ul></div>${form("Заказать звонок")}</div></section>`,
      };
      K.forEach(
        (k) =>
          (pages[k] = () => {
            const p = P[k];
            return `<div class="hero"><div class="w"><div><div class="crumbs"><a href="#home">Главная</a> / ${p.n}</div><h1>${p.n}</h1><p>${p.s}. ${p.d}</p><div class="acts"><a class="btn" href="#raschet" data-pre="${k}">Рассчитать стоимость</a><a class="btn o" href="tel:${tel}">Позвонить</a></div></div>${hero()}</div></div>
<section><div class="w two"><div><h2>Что входит</h2><ul class="feat">${p.f.map((i) => `<li>${i}</li>`).join("")}</ul></div><div><h2>Для кого</h2><p>Подходит владельцам дачных домов и коттеджей, а также кафе и гостиницам, которым нужна уютная зона на улице.</p><p>Работаем в Воронеже, Липецке и области. Замер бесплатный.</p></div></div></section>
<section class="sf"><div class="w"><h2>Комплекты</h2><div class="grid">${p.k.map((x) => kitCard(k, x)).join("")}</div></div></section>
<section><div class="w"><h2>Другие направления</h2><div class="grid">${K.filter(
              (x) => x !== k,
            )
              .map(
                (x) =>
                  `<a class="card" href="#${x}"><h3>${P[x].n}</h3><p>${P[x].s}</p></a>`,
              )
              .join("")}</div></div></section>${cta()}`;
          }),
      );

      const EX = [
        ["Освещение и розетки", 25000],
        ["Отопление или тёплый пол", 60000],
        ["Мебель и текстиль", 70000],
        ["Фундамент под ключ", 45000],
      ];
      function quiz() {
        const el = $("#quiz");
        if (!el) return;
        const s = Q.step,
          tot = 4;
        const bar = `<div class="bar"><i style="width:${(Math.min(s, tot) / tot) * 100}%"></i></div>`;
        let h = "";
        if (s === 0)
          h = `<h3>Что хотите построить?</h3><div class="opts">${K.map((k) => `<label class="opt"><input type="radio" name="t" value="${k}" ${Q.t === k ? "checked" : ""}>${P[k].n}</label>`).join("")}</div>`;
        if (s === 1)
          h = `<h3>Какая площадь?</h3><div class="big" id="av">${Q.a} м²</div><input type="range" id="ar" min="4" max="80" value="${Q.a}" aria-label="Площадь в квадратных метрах"><p class="note">Если не знаете точно, укажите примерно.</p>`;
        if (s === 2)
          h = `<h3>Какой уровень материалов?</h3><div class="opts">${[
            ["Стандарт", "Надёжные и проверенные материалы", 1],
            ["Комфорт", "Утепление, усиленный каркас", 1.3],
            ["Премиум", "Дерево ценных пород, панорамное стекло", 1.7],
          ]
            .map(
              (x) =>
                `<label class="opt"><input type="radio" name="m" value="${x[2]}" ${Q.m == x[2] ? "checked" : ""}>${x[0]}<small>${x[1]}</small></label>`,
            )
            .join("")}</div>`;
        if (s === 3)
          h = `<h3>Что добавить?</h3><div class="opts">${EX.map((x, i) => `<label class="opt"><input type="checkbox" name="e" value="${i}" ${Q.e.includes(i) ? "checked" : ""}>${x[0]}</label>`).join("")}</div><label class="f">Город<select id="qc">${["Воронеж", "Липецк", "Другой город"].map((c) => `<option ${Q.c === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>`;
        if (s === 4) {
          const base =
            Q.a * P[Q.t].rate * Q.m +
            Q.e.reduce((t, i) => t + EX[i][1], 0) +
            (Q.c === "Другой город" ? 15000 : 0);
          h = `<h3>Ориентировочная стоимость</h3><div class="big">${rub(base * 0.9)} – ${rub(base * 1.1)}</div><p class="note">${P[Q.t].n}, ${Q.a} м². Точную цену назовём после бесплатного замера.</p><div class="ok" style="margin:1.2rem 0">Оставьте телефон, и мы пришлём подробную смету и подберём время замера.</div>${form("Получить точный расчёт").replace('<form class="q" id="lead" style="max-width:520px">', '<div id="lead" data-q="1">').replace("</form>", "</div>").replace('<button class="btn" type="submit">', '<button class="btn" type="button" id="qs">')}`;
        }
        const nav =
          s < 4
            ? `<div style="display:flex;gap:.7rem">${s > 0 ? '<button class="btn o" id="bk" type="button">Назад</button>' : ""}<button class="btn" id="nx" type="button">${s === 3 ? "Показать цену" : "Далее"}</button></div>`
            : `<button class="btn o" id="rs" type="button" style="margin-top:1rem">Рассчитать заново</button>`;
        el.innerHTML = `<div class="q">${bar}${h}${nav}</div>`;
        el.querySelectorAll("input[name=t]").forEach(
          (i) => (i.onchange = () => (Q.t = i.value)),
        );
        el.querySelectorAll("input[name=m]").forEach(
          (i) => (i.onchange = () => (Q.m = +i.value)),
        );
        el.querySelectorAll("input[name=e]").forEach(
          (i) =>
            (i.onchange = () => {
              Q.e = [...el.querySelectorAll("input[name=e]:checked")].map(
                (x) => +x.value,
              );
            }),
        );
        const r = $("#ar");
        if (r)
          r.oninput = () => {
            Q.a = +r.value;
            $("#av").textContent = Q.a + " м²";
          };
        const c = $("#qc");
        if (c) c.onchange = () => (Q.c = c.value);
        const nx = $("#nx");
        if (nx)
          nx.onclick = () => {
            Q.step++;
            quiz();
          };
        const bk = $("#bk");
        if (bk)
          bk.onclick = () => {
            Q.step--;
            quiz();
          };
        const rs = $("#rs");
        if (rs)
          rs.onclick = () => {
            Q.step = 0;
            quiz();
          };
        const qs = $("#qs");
        if (qs)
          qs.onclick = () => {
            const b = $("#lead");
            const n = b.querySelector("[name=n]").value.trim(),
              p = b.querySelector("[name=p]").value.trim();
            if (!n || !p) {
              alert("Укажите имя и телефон");
              return;
            }
            done(
              b,
              `Заявка с калькулятора: ${P[Q.t].n}, ${Q.a} м², ${Q.c}. Имя: ${n}. Телефон: ${p}`,
            );
          };
      }
      /* Заявка: сейчас открывается готовое сообщение в Telegram. Чтобы слать на почту или в CRM, подключите свой обработчик здесь. */
      function done(box, text) {
        box.innerHTML = `<h3>Заявка готова</h3><p>Нажмите кнопку, чтобы отправить её менеджеру в Telegram. Или просто позвоните: <a href="tel:${tel}">${CFG.phone}</a>.</p><a class="btn" href="https://t.me/${CFG.tg}?text=${encodeURIComponent(text)}">Отправить в Telegram</a>`;
      }

      function render() {
        let h = (location.hash || "#home").slice(1);
        if (!pages[h]) h = "home";
        $("#app").innerHTML = pages[h]();
        document
          .querySelectorAll("nav a")
          .forEach((a) =>
            a.classList.toggle("on", a.getAttribute("href") === "#" + h),
          );
        document.title =
          h === "home"
            ? "TerraSphere — закрытые террасы, навесы, мангальные зоны"
            : (P[h]
                ? P[h].n
                : h === "raschet"
                  ? "Расчёт стоимости"
                  : h === "komplekty"
                    ? "Комплекты и цены"
                    : "Контакты") + " — TerraSphere";
        if (h === "raschet") quiz();
        document.querySelectorAll("form#lead").forEach(
          (f) =>
            (f.onsubmit = (e) => {
              e.preventDefault();
              const d = new FormData(f);
              done(
                f,
                `Заявка с сайта. Имя: ${d.get("n")}. Телефон: ${d.get("p")}. Город: ${d.get("c")}`,
              );
            }),
        );
        document.querySelectorAll("[data-pre]").forEach((a) =>
          a.addEventListener("click", () => {
            Q.t = a.dataset.pre;
            Q.step = 0;
          }),
        );
        window.scrollTo(0, 0);
      }
      $("#nav").innerHTML = [
        ["terrasy", "Террасы"],
        ["navesy", "Навесы"],
        ["mangal", "Мангальные зоны"],
        ["besedki", "Беседки"],
        ["vhod", "Входные группы"],
        ["komplekty", "Комплекты"],
        ["kontakty", "Контакты"],
      ]
        .map((x) => `<a href="#${x[0]}">${x[1]}</a>`)
        .join("");
      const ht = $("#hTel");
      ht.href = "tel:" + tel;
      ht.textContent = CFG.phone;
      $("#foot").innerHTML =
        `<div><b>TerraSphere</b>Террасы, навесы, мангальные зоны и беседки в Воронеже и Липецке.</div><div><b>Связаться</b><a href="tel:${tel}">${CFG.phone}</a><br><a href="https://t.me/${CFG.tg}">Telegram</a> · <a href="https://wa.me/${CFG.wa}">WhatsApp</a><br>${CFG.email}</div>${CFG.hours}</div>`;
      addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
